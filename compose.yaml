services:
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      # Only reachable from this machine
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      # pgAdmin runs without a login, so only reachable from this machine
      - "127.0.0.1:5050:80"
    environment:
      # Required by pgAdmin
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret

      # Don't require the user to login
      PGADMIN_CONFIG_SERVER_MODE: 'False'

      # Don't require a "master" password after logging in
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'

  # The bot itself, only started with: docker compose --profile bot up -d --build
  # A plain "docker compose up" leaves it out, so it never runs next to a bot you are debugging
  # (two processes with the same token would both answer every command).
  nivbot:
    profiles: ["bot"]
    build:
      context: .
      dockerfile: NivBot/Dockerfile
    # appsettings.json isn't copied into the image, all settings come from here (values from .env).
    # Any other setting works the same way, e.g. Tasks__SkipCooldown, see NivBot/appsettings.example.json.
    environment:
      Discord__Token: ${DISCORD_TOKEN:-}
      ConnectionStrings__Goodplace: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-postgres};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}"
      Temple__GroupId: ${TEMPLE_GROUP_ID:-0}
      Temple__GroupKey: ${TEMPLE_GROUP_KEY:-}
      WiseOldMan__GroupId: ${WOM_GROUP_ID:-0}
      WiseOldMan__GroupVerificationCode: ${WOM_GROUP_VERIFICATION_CODE:-}
      WiseOldMan__ApiKey: ${WOM_API_KEY:-}
      Roles__AnnouncementChannelId: ${ROLES_ANNOUNCEMENT_CHANNEL_ID:-0}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
